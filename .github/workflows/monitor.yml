name: Kaggle Competition Monitor

on:
  schedule:
    # Run at 09:00 and 21:00 UTC every day
    - cron: "0 9,21 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit seen_competitions.json updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run competition monitor
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PAGES: "3"
          MIN_SCORE: "75"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python main.py


      - name: Commit updated seen_competitions.json
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_competitions.json
          git diff --staged --quiet && echo "No changes to commit." || git commit -m "chore: update seen competitions [skip ci]"
          git push || echo "Nothing to push."
