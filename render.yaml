services:
  - type: web
    name: kaggle-competition-monitor
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: KAGGLE_API_TOKEN
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: MIN_SCORE
        value: "75"
      - key: MAX_PAGES
        value: "3"
      - key: MAX_DATASET_MB
        value: "5120"
      - key: MIN_DAYS_REMAINING
        value: "7"
      - key: POLL_INTERVAL_HOURS
        value: "6"

